# Journald retention drop-in for BlogAlone. spdlog writes structured lines to
# stdout/stderr only (no file sink); systemd captures them into the journal
# via blogalone.service's StandardOutput=journal/StandardError=journal, so
# retention is governed by journald itself rather than logrotate.
#
# Install as /etc/systemd/journald.conf.d/blogalone.conf, then:
#   sudo systemctl restart systemd-journald
#
# This is a machine-wide journald setting (systemd has no built-in per-unit
# retention knob outside journal namespaces), so it bounds retention for the
# whole host, not just blogalone.service.
[Journal]
MaxRetentionSec=30day
