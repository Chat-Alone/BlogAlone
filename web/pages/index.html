<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BlogAlone - 论坛首页</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/forum.css">
  <link rel="stylesheet" href="/static/css/forms.css">
  <link rel="stylesheet" href="/static/css/modal.css">
  <script type="module" src="/static/js/site-chrome.js"></script>
  <script type="module" src="/static/js/page-home.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到主内容</a>
  <div class="ba-shell">
    <header class="ba-site-header">
      <div class="ba-container ba-site-header-inner">
        <a class="ba-brand" href="/">BlogAlone</a>
        <nav class="ba-primary-nav" aria-label="主导航">
          <a href="/">首页</a>
        </nav>
        <div class="ba-session-box" data-session-box aria-label="账户"></div>
      </div>
    </header>
    <div class="ba-announcement">
      <div class="ba-container">站点公告:BlogAlone 是一个用于演示的小型贴吧式论坛。</div>
    </div>
    <main id="main" class="ba-main" tabindex="-1">
      <div class="ba-container">
        <section class="ba-panel" aria-labelledby="forums-title">
          <div class="ba-panel-title">
            <h1 id="forums-title">板块目录</h1>
            <span class="ba-status-pill" data-forums-status>正在加载</span>
          </div>
          <div class="ba-panel-body" data-forums-body>
            <div class="ba-loading-state" role="status">正在加载板块列表...</div>
          </div>
        </section>
      </div>
    </main>
    <footer class="ba-site-footer">
      <div class="ba-container ba-footer-links">
        <span>BlogAlone MVP</span>
        <a href="/api/healthz">服务状态</a>
      </div>
    </footer>
  </div>
</body>
</html>
