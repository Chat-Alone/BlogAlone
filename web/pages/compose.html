<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发表新主题 - BlogAlone</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/forms.css">
  <link rel="stylesheet" href="/static/css/modal.css">
  <script type="module" src="/static/js/site-chrome.js"></script>
  <script type="module" src="/static/js/page-compose.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到主内容</a>
  <div class="ba-shell">
    <header class="ba-site-header">
      <div class="ba-container ba-site-header-inner">
        <a class="ba-brand" href="/">BlogAlone</a>
        <nav class="ba-primary-nav" aria-label="主导航">
          <a href="/">首页</a>
        </nav>
        <div class="ba-session-box" data-session-box aria-label="账户"></div>
      </div>
    </header>
    <main id="main" class="ba-main" tabindex="-1">
      <div class="ba-container">
        <section class="ba-panel" style="max-width: 720px">
          <div class="ba-panel-title"><h1>发表新主题</h1></div>
          <div class="ba-panel-body">
            <div data-form-error-holder></div>
            <form class="ba-form ba-form-wide" data-compose-form novalidate>
              <div class="ba-field">
                <label for="compose-forum">板块</label>
                <select id="compose-forum" name="forum" required></select>
              </div>
              <div class="ba-field">
                <label for="compose-title">标题(1-80字符)</label>
                <input type="text" id="compose-title" name="title" maxlength="80" required>
              </div>
              <div class="ba-field">
                <label id="compose-body-label">正文</label>
                <div data-editor-mount></div>
              </div>
              <div class="ba-form-actions">
                <button type="submit" class="ba-btn ba-btn-primary" data-submit-button>发表主题</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>
    <footer class="ba-site-footer">
      <div class="ba-container ba-footer-links">
        <span>BlogAlone MVP</span>
      </div>
    </footer>
  </div>
</body>
</html>
